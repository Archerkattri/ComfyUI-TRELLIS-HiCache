# Packaging metadata for the registry.comfy.org Comfy Registry.
# Field layout follows https://docs.comfy.org/registry/specifications

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-trellis-hicache"
description = "Training-free TRELLIS image-to-3D acceleration: forecast the flow-matching velocity on skipped DiT steps (HiCache Hermite / HiCache++ DMD, via hicache-pp) across both the sparse-structure and SLaT stages. Drop between the TRELLIS loader and sampler."
version = "0.1.3"
keywords = ["comfyui", "diffusion-acceleration", "caching", "training-free", "trellis", "image-to-3d"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["hicache-pp>=1.2.1"]
classifiers = ["Development Status :: 4 - Beta"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.24", "torch>=2.1", "ruff>=0.16"]

[project.urls]
Repository = "https://github.com/Archerkattri/ComfyUI-TRELLIS-HiCache"
BugTracker = "https://github.com/Archerkattri/ComfyUI-TRELLIS-HiCache/issues"

[tool.comfy]
PublisherId = "archerkattri"
DisplayName = "ComfyUI-TRELLIS-HiCache"
Icon = "https://raw.githubusercontent.com/Archerkattri/ComfyUI-TRELLIS-HiCache/master/icon.png"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["trellis_hicache_patch", "nodes"]
