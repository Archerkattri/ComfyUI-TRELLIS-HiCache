<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">TRELLIS HiCache: isolated two-stage acceleration</title>
  <desc id="desc">Sparse-structure and SLaT maintain independent schedules, histories, fallbacks, and reports.</desc>
  <rect width="1200" height="450" rx="22" fill="#020617"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}.muted{fill:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#111827;stroke:#334155;stroke-width:1.5}</style>
  </defs>
  <text class="t" x="38" y="46" font-size="25" font-weight="700">TRELLIS HiCache: isolated two-stage acceleration</text>
  <text class="t muted" x="38" y="72" font-size="14">Sparse-structure and SLaT maintain independent schedules, histories, fallbacks, and reports.</text>
  <g transform="translate(35 190)"><rect class="box" width="145" height="72" rx="12" stroke="#a78bfa"/><text class="t" x="72.5" y="31" text-anchor="middle" font-size="14" font-weight="700">Image</text><text class="m muted" x="72.5" y="54" text-anchor="middle" font-size="11">conditioning</text></g>
  <path class="line" d="M180 226L235 226"/>
  <rect x="235" y="112" width="365" height="220" rx="16" fill="#0f172a" stroke="#8b5cf6"/><text class="t" x="260" y="142" font-size="16" font-weight="700">1 · sparse structure</text>
  <g transform="translate(270 170)"><rect class="box" width="130" height="65" rx="12" stroke="#f59e0b"/><text class="t" x="65" y="27.5" text-anchor="middle" font-size="14" font-weight="700">DiT anchor</text><text class="m muted" x="65" y="50.5" text-anchor="middle" font-size="11">compute</text></g>
  <g transform="translate(435 170)"><rect class="box" width="130" height="65" rx="12" stroke="#22c55e"/><text class="t" x="65" y="27.5" text-anchor="middle" font-size="14" font-weight="700">forecast</text><text class="m muted" x="65" y="50.5" text-anchor="middle" font-size="11">or fallback</text></g>
  <path class="line" d="M400 202L435 202"/>
  <text class="m muted" x="418" y="274" text-anchor="middle" font-size="11">state: sparse / run id</text>
  <path class="line" d="M600 226L650 226"/>
  <rect x="650" y="112" width="365" height="220" rx="16" fill="#0f172a" stroke="#8b5cf6"/><text class="t" x="675" y="142" font-size="16" font-weight="700">2 · SLaT</text>
  <g transform="translate(685 170)"><rect class="box" width="130" height="65" rx="12" stroke="#f59e0b"/><text class="t" x="65" y="27.5" text-anchor="middle" font-size="14" font-weight="700">DiT anchor</text><text class="m muted" x="65" y="50.5" text-anchor="middle" font-size="11">compute</text></g>
  <g transform="translate(850 170)"><rect class="box" width="130" height="65" rx="12" stroke="#22c55e"/><text class="t" x="65" y="27.5" text-anchor="middle" font-size="14" font-weight="700">forecast</text><text class="m muted" x="65" y="50.5" text-anchor="middle" font-size="11">or fallback</text></g>
  <path class="line" d="M815 202L850 202"/>
  <text class="m muted" x="833" y="274" text-anchor="middle" font-size="11">state: slat / run id</text>
  <path class="line" d="M1015 226L1050 226"/>
  <g transform="translate(1050 190)"><rect class="box" width="120" height="72" rx="12" stroke="#38bdf8"/><text class="t" x="60" y="31" text-anchor="middle" font-size="14" font-weight="700">3D asset</text><text class="m muted" x="60" y="54" text-anchor="middle" font-size="11">mesh</text></g>
  <path class="dash" d="M418 332V382H833V332"/><text class="m" x="625" y="409" text-anchor="middle" font-size="12">whole-asset report joins stage-local compute, forecast, and fallback counts</text>
